spring:
  application:
    name: suinevere-site-terminal
  rsocket:
    server:
      transport: websocket
      mapping-path: /rsocket
  webflux:
    base-path: /zork
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, profile, email]
            redirect-uri: https://suin.uk/zork/login/oauth2/code/google

server:
  forward-headers-strategy: framework
  reactive:
    session:
      cookie:
        # Without this the cookie defaults to Path=/zork/, which RFC 6265 does not
        # send to /zork, so the post-login redirect arrives unauthenticated.
        path: /zork

terminal:
  upstream:
    host: suinevere.duckdns.org
    port: 23
    connect-timeout: 10s
    max-sessions: 32
    output-buffer: 1024
