# ----------------------
#  terminal.suin.uk.conf
#  Description: Serves the terminal page and its WebSocket from its own vhost, clear of the catch-all redirects.
#  Author: suinevere
#  Dependencies: certbot certificate for terminal.suin.uk
#  Globals: N/A
# ----------------------
#
# Goes in sites-available/ and is symlinked into sites-enabled/, unlike the stream block.
#
# This is a separate vhost on purpose: both suinevere.duckdns.org server blocks end in a
# catch-all `location /` that would swallow the WebSocket upgrade before it ever reached
# /rsocket.
#

# Browsers do not apply CORS to WebSockets, so a cookie-authenticated upgrade is
# cross-origin openable unless the Origin is checked here.
map $http_origin $rsocket_origin_ok {
    default           0;
    "https://suin.uk" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name terminal.suin.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name terminal.suin.uk;

    ssl_certificate     /etc/letsencrypt/live/terminal.suin.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terminal.suin.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Spring Security does not filter the RSocket endpoint, so the upgrade is
    # authenticated here or nowhere.
    location = /_authcheck_internal {
        internal;
        proxy_pass http://127.0.0.1:8080/zork/_authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /zork/rsocket {
        if ($rsocket_origin_ok = 0) {
            return 403;
        }

        auth_request /_authcheck_internal;

        # Spring serves the socket at /rsocket; base-path does not reach it.
        proxy_pass http://127.0.0.1:8080/rsocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A session idling at a prompt sends nothing; the 60s default would drop it.
        proxy_read_timeout 3600s;
    }

    # Spring's base-path plus oauth2Login mishandles the slashless form; normalise it here.
    location = /zork {
        return 301 /zork/;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }
}
