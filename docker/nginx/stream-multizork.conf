# ----------------------
#  stream-multizork.conf
#  Description: Fronts port 23 with a per-IP connection limit before anything reaches the C parser.
#  Author: suinevere
#  Dependencies: libnginx-mod-stream
#  Globals: N/A
# ----------------------
#
# `stream` is a sibling of `http`, not a child, so this cannot be included from
# sites-enabled/ or conf.d/ — both of those are included from inside `http`.
# Include it at the TOP LEVEL of /etc/nginx/nginx.conf:
#
#     include /etc/nginx/streams-enabled/*.conf;
#
stream {
    limit_conn_zone $binary_remote_addr zone=mud:10m;

    server {
        listen 23;
        limit_conn mud 3;

        # The stream default is 10m; a Saturn sitting at a prompt sends nothing
        # and would be dropped mid-game.
        proxy_timeout 1h;

        #proxy_pass 127.0.0.1:2323;
        proxy_pass 127.0.0.1:2322;   # ops/authproxy, once AUTH_SECRET exists
    }
}
