# ----------------------
#  docker-compose.yml
#  Description: Runs the terminal bridge and multizorkd together so neither is published beyond loopback.
#  Author: suinevere
#  Dependencies: Dockerfile, multizork/Dockerfile, README.md
#  Globals: TERMINAL_UPSTREAM_HOST, TERMINAL_UPSTREAM_PORT, TERMINAL_UPSTREAM_MAXSESSIONS
# ----------------------

# Pinned so the volume name does not follow the directory this is run from.
name: suinevere-terminal

services:
  multizork:
    build:
      context: multizork
      dockerfile: Dockerfile
    image: multizorkd:latest
    container_name: multizork
    restart: unless-stopped

    # nginx binds 23 on the host and proxies here. Publishing 23 from Docker would
    # take the port back and put the C parser directly on the internet.
    ports:
      - "127.0.0.1:2323:2323"

    volumes:
      - multizork-data:/data

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Opens a real connection, so multizorkd logs a connect/disconnect pair each time.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2323"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  authproxy:
    build:
      context: ../ops/authproxy
      dockerfile: Dockerfile
    image: suinevere-authproxy:latest
    container_name: suinevere-authproxy
    restart: unless-stopped
    depends_on:
      - multizork

    # nginx on the host proxies port 23 here. Never published beyond loopback.
    ports:
      - "127.0.0.1:2322:2322"

    environment:
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set in docker/.env}"
      AUTH_MAGIC: "${AUTH_MAGIC:-AUTH}"
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "2322"
      UPSTREAM_HOST: "multizork"
      UPSTREAM_PORT: "2323"
      AUTH_TIMEOUT: "5.0"
      MAX_CONN: "32"
      IDLE_TIMEOUT: "1800"

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  terminal:
    # The context is the repo root because the jar is built from source; `.dockerignore`
    # lives there for the same reason, and has to stay there to apply.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: suinevere-site-terminal:0.0.1
    container_name: suinevere-site-terminal
    restart: unless-stopped
    depends_on:
      - multizork

    # Loopback only. Docker writes iptables rules ahead of ufw's, so a 0.0.0.0 publish
    # would be reachable from the internet no matter what ufw says.
    ports:
      - "127.0.0.1:8080:8080"

    # Reaches multizorkd over the compose network, so browser sessions never leave the
    # box and never collapse into one source IP against `limit_conn mud 3`.
    environment:
      TERMINAL_UPSTREAM_HOST: "${TERMINAL_UPSTREAM_HOST:-multizork}"
      TERMINAL_UPSTREAM_PORT: "${TERMINAL_UPSTREAM_PORT:-2323}"
      TERMINAL_UPSTREAM_MAXSESSIONS: "${TERMINAL_UPSTREAM_MAXSESSIONS:-32}"

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # spring.webflux.base-path moved the whole app off root, so / now 404s; /zork/_authcheck
    # answers 401 unauthenticated by design, which proves both liveness and that security is wired.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /zork/_authcheck HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 401 "'
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 768M

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  multizork-data:
