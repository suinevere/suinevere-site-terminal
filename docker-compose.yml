# ----------------------
#  docker-compose.yml
#  Description: Runs the terminal bridge on loopback so nginx, not Docker's iptables rules, decides who reaches it.
#  Author: suinevere
#  Dependencies: Dockerfile, ops/README.md
#  Globals: TERMINAL_UPSTREAM_HOST, TERMINAL_UPSTREAM_PORT, TERMINAL_UPSTREAM_MAXSESSIONS
# ----------------------
services:
  terminal:
    build: .
    image: suinevere-site-terminal:0.0.1
    container_name: suinevere-site-terminal
    restart: unless-stopped

    # Loopback only. Docker writes iptables rules ahead of ufw's, so a 0.0.0.0 publish
    # would be reachable from the internet no matter what ufw says.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      TERMINAL_UPSTREAM_HOST: "${TERMINAL_UPSTREAM_HOST:-suinevere.duckdns.org}"
      TERMINAL_UPSTREAM_PORT: "${TERMINAL_UPSTREAM_PORT:-23}"
      TERMINAL_UPSTREAM_MAXSESSIONS: "${TERMINAL_UPSTREAM_MAXSESSIONS:-32}"

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET / HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 768M

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# On-box loopback upstream (see ops/README.md before switching).
#
# The default above reaches multizorkd the long way round — out to the public address and
# back in through the nginx stream. On the Oracle box that hairpin makes every browser
# session share one source IP against `limit_conn mud 3`, so the fourth is refused.
#
# To go straight to the container on loopback instead, replace the `ports` block with
# host networking and bind the server itself to loopback:
#
#     network_mode: host
#     environment:
#       SERVER_ADDRESS: "127.0.0.1"
#       TERMINAL_UPSTREAM_HOST: "127.0.0.1"
#       TERMINAL_UPSTREAM_PORT: "2323"
#
# `SERVER_ADDRESS` is not optional there: without it host networking publishes 8080 on
# every interface, which is the exact exposure the loopback publish exists to prevent.
